name: Monitor Task Progress

on:
  push:
    branches: ["repo-monitor-rafi"]
  workflow_dispatch:

jobs:
  monitor-homework:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r repo-monitor/requirements.txt

      - name: Run Repo Monitor
        run: |
          cd repo-monitor
          python monitor.py
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_SENDER_EMAIL: ${{ secrets.SENDGRID_SENDER_EMAIL }}
          EMAIL_ADDRESS_NAHAR: ${{ secrets.EMAIL_ADDRESS_NAHAR }}
